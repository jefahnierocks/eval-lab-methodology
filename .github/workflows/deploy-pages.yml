name: Deploy Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Render and deploy the public site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        env:
          MISE_CACHE_DIR: ${{ runner.temp }}/mise-cache
        with:
          version: "2026.10.1"
          install_args: python uv gitleaks
          cache: false
          mise_dir: ${{ runner.temp }}/mise
          wings_enabled: false

      - name: Prepare pinned manifest Git in an owned runner prefix
        id: manifest-git
        run: python3 -I -S -B scripts/prepare_manifest_git.py

      - name: Sync pinned gate runtime
        run: uv sync --frozen --python 3.13.15 --no-install-project --extra dev --extra report

      - name: Read pinned Quarto version
        id: quarto-version
        run: echo "version=$(<.quarto-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "${{ steps.quarto-version.outputs.version }}"

      - name: Run canonical merge gate
        env:
          PROJECT_MANIFEST_GIT: ${{ steps.manifest-git.outputs.git }}
        run: uv run --frozen --no-sync bash scripts/run-merge-gate.sh

      - name: Copy rendered reports into the site
        shell: bash
        run: |
          shopt -s nullglob globstar
          sample_html="$(find reports/rendered/sample -name 'methodology-report.html' -print -quit)"
          if [ -z "$sample_html" ]; then
            echo "rendered sample report not found under reports/rendered/sample" >&2
            exit 1
          fi
          mkdir -p _site/reports/sample
          cp "$sample_html" _site/reports/sample/methodology-report.html

          for evidence in evidence/campaigns/**/evidence.json; do
            safe_name="${evidence#evidence/campaigns/}"
            safe_name="${safe_name%/evidence.json}"
            safe_name="${safe_name//\//-}"
            campaign_html="$(find "reports/rendered/campaigns/${safe_name}" -name '*.html' -print -quit)"
            if [ -z "$campaign_html" ]; then
              echo "rendered campaign report not found for ${safe_name}" >&2
              exit 1
            fi
            mkdir -p "_site/reports/campaigns/${safe_name}"
            cp "$campaign_html" "_site/reports/campaigns/${safe_name}/methodology-report.html"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
